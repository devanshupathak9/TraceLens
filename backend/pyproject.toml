# Tooling configuration only. Dependencies live in requirements.txt, and the app
# is run directly rather than installed as a package, so there is no [project]
# table or build backend here.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
# Alembic's generated migrations are templated output; linting them for style
# creates churn on every autogenerate.
exclude = ["alembic/versions/*"]

[tool.ruff.lint.isort]
known-first-party = ["config", "database", "models", "schemas", "security", "providers", "routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Each test coroutine gets a fresh event loop, so a session created in one test
# can't leak into another.
asyncio_default_fixture_loop_scope = "function"
