# The SDK is a package — it gets imported by the backend, so it needs
# installable metadata: `pip install -e ./sdk`.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracelens"
version = "0.1.0"
description = "Lightweight inference logging for LLM applications"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["tracelens"]
