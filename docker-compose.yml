# The full TraceLens stack: postgres + migrations + chat backend +
# logging service + frontend.
#
#   docker compose up --build
#
# Frontend:   http://localhost:3000
# Chat API:   http://localhost:8000/docs
# Logging:    http://localhost:8001/health
#
# OPENAI_API_KEY / ANTHROPIC_API_KEY are read from the shell or a .env file next
# to this compose file. Without a key for the configured model's provider, the
# backend answers in echo mode (and ships no events).
#
# QUEUE_URL + AWS credentials come from the same place. The logging service
# publishes to SQS and the row is written by the AWS Lambda, so with no queue
# configured the local database gets no inference_logs rows.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatjippity
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatjippity"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies Alembic migrations, then exits. The API waits for it so
  # replicas never race each other running DDL.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: tracelens-chat-api
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/chatjippity
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  chat-api:
    image: tracelens-chat-api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/chatjippity
      TRACELENS_INGEST_URL: http://logging-service:8001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-compose-secret-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      logging-service:
        condition: service_started

  logging-service:
    build:
      context: .
      dockerfile: logging-service/Dockerfile
    environment:
      # Every event goes to SQS; the Lambda subscribed to the queue writes the
      # inference_logs row. Without these the service still accepts events and
      # logs them, but drops them instead of publishing.
      QUEUE_URL: ${QUEUE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    ports:
      - "8001:8001"

  frontend:
    build:
      context: frontend
    ports:
      - "3000:80"
    depends_on:
      chat-api:
        condition: service_started

volumes:
  db-data:
